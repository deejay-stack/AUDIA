<template id="product-detail-template">
  <article class="product-detail">
    <img data-field="detail-image" alt="" class="product-detail__image">
    <div class="product-detail__copy">
      <p class="section-label" data-field="detail-category"></p>
      <p class="product-detail__price" data-field="detail-price"></p>
      <p data-field="detail-description"></p>
      <h3>Specifications</h3>
      <ul class="product-detail__specs" data-field="detail-specs"></ul>
      <p class="form-hint" data-field="detail-stock"></p>
      <button type="button" class="primary-btn" data-field="detail-add">Add to cart</button>
    </div>
  </article>
</template>
