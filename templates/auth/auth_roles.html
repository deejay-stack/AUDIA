<!-- MODULE: AUTH | COMPONENT: Separate customer/admin sign-in navigation
     PURPOSE: Link to distinct server-defined login pages. CSS: assets/css/auth/auth_roles.css
     JS: assets/js/auth/auth.js. Preserve IDs and data-action/data-field hooks. -->
<nav aria-label="Sign-in portal"
        data-field="roles"
        class="auth-roles__roles"
      >
        <a href="{{ url_for('login_page') }}"
          class="{{ 'auth-roles__option--selected' if auth_mode != 'admin' else 'auth-roles__option' }}"
          data-action="role-customer"
          {% if auth_mode != 'admin' %}aria-current="page"{% endif %}
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-user-round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="5"></circle>
            <path d="M20 21a8 8 0 0 0-16 0"></path>
          </svg>
          Customer
        </a>
        <a href="{{ url_for('admin_login_page') }}"
          class="{{ 'auth-roles__option--selected' if auth_mode == 'admin' else 'auth-roles__option' }}"
          data-action="role-admin"
          {% if auth_mode == 'admin' %}aria-current="page"{% endif %}
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-shield-check"
            aria-hidden="true"
          >
            <path
              d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
            ></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
          Administrator
        </a>
      </nav>
