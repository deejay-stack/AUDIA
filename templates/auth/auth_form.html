<!-- MODULE: AUTH | COMPONENT: Auth form
     PURPOSE: Auth form structure. CSS: assets/css/auth/auth_form.css
     JS: assets/js/auth/auth.js. Preserve IDs and data-action/data-field hooks. -->
<form method="post" class="auth-form__full-name-email-address-password-form" data-form="auth">
        <label class="auth-form__name-wrap" data-field="name-wrap" hidden
          ><span class="auth-form__full-name">Full name</span
          ><span class="input-shell auth-form__input-shell"
            ><input
              class="auth-form__name"
              autocomplete="name"
              maxlength="100"
              minlength="2"
              data-field="name" /></span
        ></label>
        <label class="auth-form__email-wrap" data-field="email-wrap">
          <span class="auth-form__email-address">Email address</span>
          <span class="input-shell auth-form__input-shell">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-mail"
              aria-hidden="true"
            >
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            </svg>
            <input
              required=""
              type="email"
              class="auth-form__email"
              autocomplete="email"
              maxlength="254"
              data-field="email"
            />
          </span>
        </label>
        <label class="auth-form__password-wrap" data-field="password-wrap">
          <span class="auth-form__password">Password</span>
          <span class="input-shell auth-form__input-shell">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-lock-keyhole"
              aria-hidden="true"
            >
              <circle cx="12" cy="16" r="1"></circle>
              <rect x="3" y="10" width="18" height="12" rx="2"></rect>
              <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
            </svg>
            <input
              required=""
              type="password"
              class="auth-form__password-input"
              autocomplete="current-password"
              maxlength="128"
              data-field="password"
            />
            <button
              type="button"
              class="auth-form__password-button"
              aria-label="Show password"
              data-action="password"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-eye"
                aria-hidden="true"
              >
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                ></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </span>
        </label>
        <label class="auth-form__confirm-wrap" data-field="confirm-wrap" hidden
          ><span class="auth-form__confirm-password">Confirm password</span
          ><span class="input-shell auth-form__input-shell"
            ><input
              type="password"
              autocomplete="new-password"
              maxlength="128"
              class="auth-form__confirm"
              data-field="confirm" /></span
        ></label>
        <p class="form-hint" data-field="password-hint" hidden>
          Use at least 10 characters. A longer, unique passphrase works well.
        </p>
        <div
          class="auth-form__login-options"
          data-field="login-options"
        >
          <label class="auth-form__remember-me"
            ><input
              type="checkbox"
              class="range-acid"
              checked=""
              data-field="remember"
            />
            Remember me</label
          >
          <button
            type="button"
            class="auth-form__forgot"
            data-action="forgot"
          >
            Forgot password?
          </button>
        </div>
        <p
          class="auth-form__login-error"
          role="alert"
          hidden=""
          data-field="login-error"
        ></p>
        <p
          class="form-success"
          role="status"
          hidden
          data-field="auth-success"
        ></p>
        <button
          type="submit"
          class="primary-btn auth-form__login-submit"
          data-field="login-submit"
        >
          Sign in
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-right"
            aria-hidden="true"
          >
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>
