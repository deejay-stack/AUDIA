<!-- MODULE: TUNER | COMPONENT: Tuner strings
     PURPOSE: Tuner strings structure. CSS: assets/css/tuner/tuner_strings.css
     JS: assets/js/tuner/tuner.js (pitch: assets/js/tuner/tuner_pitch.js). Preserve IDs and data-action/data-field hooks. -->
<ol class="tuner-strings" reversed>
        {% for note, frequency in [('E2', '82.41'), ('A2', '110.00'), ('D3',
        '146.83'), ('G3', '196.00'), ('B3', '246.94'), ('E4', '329.63')] %}
        <li data-tuning-note="{{ note }}">
          <span>String {{ 7 - loop.index }}</span><strong>{{ note }}</strong
          ><span>{{ frequency }} Hz</span>
        </li>
        {% endfor %}
      </ol>
