<ol class="tuner-strings" reversed>
  {% for string, note, frequency in [(6,'E2','82.41'),(5,'A2','110.00'),(4,'D3','146.83'),(3,'G3','196.00'),(2,'B3','246.94'),(1,'E4','329.63')] %}
  <li data-tuning-string="{{ string }}">
    <button type="button" class="tuner-string-button" data-string-target="{{ string }}" aria-pressed="false" aria-label="Select string {{ string }}, {{ note }}, and play its recorded reference">
      <span class="tuner-string-number">{{ string }}</span><strong>{{ note }}</strong>
      <span class="tuner-string-details"><span data-string-frequency>{{ frequency }} Hz</span><span data-reference-label>Play reference</span></span>
      <span class="tuner-string-play" aria-hidden="true">▶</span>
    </button>
  </li>
  {% endfor %}
</ol>
