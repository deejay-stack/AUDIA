<form class="stack-form" data-form="checkout"><p class="form-hint">Your instruments are reserved when you place your order. Pay with cash on delivery.</p><label>Delivery address<textarea name="address" required minlength="10" maxlength="500" autocomplete="street-address" placeholder="House number, street, barangay, city, province, postal code"></textarea></label><label>Phone number<input name="phone" type="tel" required minlength="7" maxlength="30" autocomplete="tel"></label><div class="order-total"><span>Order total</span><strong data-field="checkout-total"></strong></div><p class="form-hint">Payment: cash on delivery. No online payment is collected.</p><p class="form-error" role="alert" data-field="form-error" hidden></p><button type="submit" class="primary-btn">Place order</button></form>
