<div class="fixed inset-0 z-[60] grid place-items-center p-4">
  <button class="absolute inset-0 bg-black/65 backdrop-blur-md" aria-label="Close finder" data-motion="{&quot;initial&quot;:{&quot;opacity&quot;:0},&quot;animate&quot;:{&quot;opacity&quot;:1},&quot;viewport&quot;:false}" data-action="close-finder"></button>
  <div class="finder-modal relative w-full max-w-2xl overflow-hidden rounded-[2rem] bg-white shadow-2xl dark:bg-panel" data-motion="{&quot;initial&quot;:{&quot;opacity&quot;:0,&quot;y&quot;:28,&quot;scale&quot;:0.98},&quot;animate&quot;:{&quot;opacity&quot;:1,&quot;y&quot;:0,&quot;scale&quot;:1},&quot;viewport&quot;:false}">
    <div class="flex items-center justify-between border-b border-zinc-200 p-6 dark:border-white/10">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-compass" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path>
        </svg>
        <div>
          <p class="font-display font-semibold">AUDIA Guitar Finder</p>
          <p class="text-[10px] text-zinc-500">Four quick questions</p>
        </div>
      </div>
      <button class="icon-btn" data-action="close-finder">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>
    <div class="p-7 sm:p-10" data-field="finder-body">
      <div class="mb-8 flex gap-2" data-field="progress">
        <span class="h-1 flex-1 rounded-full bg-zinc-950 dark:bg-acid"></span>
        <span class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-white/10"></span>
        <span class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-white/10"></span>
        <span class="h-1 flex-1 rounded-full bg-zinc-200 dark:bg-white/10"></span>
      </div>
      <p class="section-label" data-field="question-number">Question 1 of 4</p>
      <h2 class="mt-3 font-display text-3xl font-semibold" data-field="question-title">What is your budget?</h2>
      <div class="mt-10" data-field="budget">
        <div class="mb-7 text-center font-display text-4xl font-semibold" data-field="budget-value">₱20,000</div>
        <input type="range" min="8000" max="60000" step="1000" class="range-acid w-full" value="20000" data-field="budget-input">
        <div class="mt-3 flex justify-between text-xs text-zinc-500">
          <span>₱8,000</span>
          <span>₱60,000</span>
        </div>
      </div>
      <div class="mt-9 grid gap-3 sm:grid-cols-2" data-field="options" hidden=""></div>
      <button class="primary-btn mt-10 w-full" data-action="finder-next">Continue <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
    </div>
  </div>
</div>
