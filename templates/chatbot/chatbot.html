<!-- MODULE: CHATBOT | COMPONENT: Floating support button and component composition
     PURPOSE: Floating support button and component composition structure. CSS: assets/css/chatbot/chatbot.css
     JS: assets/js/chatbot/chatbot.js; assets/js/chatbot/chatbot_ui.js; assets/js/chatbot/chatbot_api.js. Preserve IDs and data-action/data-field hooks. -->
<!-- Existing AUDI interface, shared by the public landing page and the shop. -->
<div data-chatbot>
  <button
    class="chatbot-toggle"
    aria-label="Open customer support"
    data-action="chat"
    aria-expanded="false"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="21"
      height="21"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-message-circle"
      aria-hidden="true"
    >
      <path
        d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"
      ></path>
    </svg>
  </button>
  <!-- Chat -->
  <!-- Component: chatbot panel | CSS: assets/css/chatbot/chatbot_panel.css -->
  {% include 'chatbot/chatbot_panel.html' %}

  <!-- Chat Suggestions -->
  <!-- Component: chatbot suggestions | CSS: assets/css/chatbot/chatbot_suggestions.css -->
  {% include 'chatbot/chatbot_suggestions.html' %}

  <!-- Message -->
  <!-- Component: chatbot message | CSS: assets/css/chatbot/chatbot_message.css -->
  {% include 'chatbot/chatbot_message.html' %}
</div>
