<!-- MODULE: ACCOUNT | COMPONENT: Account password
     PURPOSE: Account password structure. CSS: assets/css/account/account_password.css
     JS: assets/js/account/account.js. Preserve IDs and data-action/data-field hooks. -->
<section class="surface-card account-section">
        <h2 class="account-password__account-security">Account security</h2>
        <p class="form-hint account-password__form-hint">
          Changing your password signs out your other sessions.
        </p>
        <form method="post" class="stack-form account-password__stack-form" data-form="password">
          <label
            >Current password<input
              name="current_password"
              type="password"
              required
              autocomplete="current-password"
              maxlength="128" /></label
          ><label
            >New password<input
              name="password"
              type="password"
              required
              minlength="10"
              maxlength="128"
              autocomplete="new-password" /></label
          ><label
            >Confirm new password<input
              name="confirm"
              type="password"
              required
              minlength="10"
              maxlength="128"
              autocomplete="new-password"
          /></label>
          <p class="form-error" role="alert" data-field="form-error" hidden></p>
          <button class="primary-btn" type="submit">Update password</button>
        </form>
      </section>
