<!-- MODULE: ACCOUNT | COMPONENT: Account orders
     PURPOSE: Account orders structure. CSS: assets/css/account/account_orders.css
     JS: assets/js/account/account.js. Preserve IDs and data-action/data-field hooks. -->
<section id="orders" class="surface-card account-section account-orders__surface-card">
      <div class="account-orders__surface-card-div">
        <h2 class="account-orders__your-orders">Your orders</h2>
        <button class="secondary-btn" data-action="refresh-orders">
          Refresh
        </button>
      </div>
      <div class="account-orders" data-field="orders">
        <p class="empty-state">Loading your orders…</p>
      </div>
      <p class="form-hint" data-field="orders-update" role="status"></p>
    </section>
<section class="surface-card notification-panel"><div class="admin-section-heading"><h2>Activity notifications</h2><button type="button" class="secondary-btn" data-action="read-notifications">Mark read</button></div><div data-field="account-notifications" class="request-history"></div></section>
