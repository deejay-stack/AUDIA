<template id="overview-template"><div class="finance-workspace">
<div class="admin-section-heading"><div><p class="section-label" data-field="today"></p><h2 data-field="admin-greeting">Welcome back.</h2><p class="form-hint">Sales &amp; revenue · Asia/Manila</p></div><button class="primary-btn" data-action="pos">Open POS</button></div>
<div class="ledger-filters stack-form"><label>Reporting period<select data-field="report-period"><option value="day">Today</option><option value="week">Last 7 days</option><option value="month">Last 30 days</option><option value="year">Last 365 days</option></select></label><label>From<input type="date" data-field="report-start"></label><label>Through<input type="date" data-field="report-end"></label><label>Chart grouping<select data-field="report-group"><option value="day">Daily</option><option value="week">Weekly</option><option value="month">Monthly</option><option value="year">Yearly</option></select></label><button class="secondary-btn" data-action="report-dates">Apply dates</button><button class="secondary-btn" data-action="print-report">Print report</button></div>
<p class="form-hint">New payments run in Test Mode — No real funds transferred. Click a financial card to inspect its ledger.</p>
<div data-field="operations-summary" class="operations-summary"></div>
<p class="form-hint" data-field="completion-rates"></p>
<details class="surface-card finance-panel"><summary>Recent customer / order activity</summary><ol data-field="recent-activity" class="order-history"></ol></details>
<div class="stats-grid finance-stats">
{% for key,label,glyph in [('gross_revenue','Total collected (after refunds)','₱'),('today_revenue','Today’s revenue','☀'),('weekly_revenue','This week’s revenue','↗'),('monthly_revenue','This month’s revenue','▦'),('gross_sales','Gross merchandise sales','◈'),('net_sales','Net merchandise sales','−'),('collected_total','Collected before refunds','+'),('pending_collection','Pending collection','◷'),('refunded_total','Completed refunds','↶'),('pending_payments','Pending payments','o'),('paid_orders','Collected transactions','✓'),('cancelled_orders','Cancelled orders','×'),('refunded_transactions','Refunded transactions','↶'),('products_sold','Products sold (before returns)','♫'),('total_orders','Orders placed','▣'),('new_customers','New customers','♙'),('low_stock_items','Low stock products','!')] %}
<button class="stat-card surface-card finance-stat" data-action="transactions" data-metric="{{ key }}"><span class="stat-glyph" aria-hidden="true">{{ glyph }}</span><span>{{ label }}</span><strong data-field="{{ key }}">—</strong></button>{% endfor %}</div>
<p class="form-hint" data-field="report-formula"></p><p class="form-hint" data-field="report-legacy" hidden></p><div class="finance-charts">
{% for key,title,hint in [('revenue-chart','Collected revenue over time','Collections minus refunds by event date'),('method-chart','Revenue by payment method',''),('channel-chart','Sales channel comparison',''),('status-chart','Order status distribution','Orders placed in the selected period'),('category-report','Merchandise by category','Collected merchandise before returns'),('best-sellers','Best-selling products','Units and discounted merchandise revenue before returns')] %}
<section class="surface-card finance-panel"><h3>{{ title }}</h3><p class="form-hint">{{ hint }}</p><div data-field="{{ key }}"></div></section>{% endfor %}</div>
<section class="surface-card finance-panel"><div class="admin-section-heading"><h3>Recent orders</h3><button class="secondary-btn" data-action="sales">View all orders</button></div><div class="table-wrap"><table class="ledger-table"><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Status</th><th>Total</th></tr></thead><tbody data-field="sales-rows"></tbody></table></div><p class="empty-state" data-field="sales-empty" hidden>No orders yet.</p></section></div></template>
