<template id="pos-template"><section class="finance-workspace">
<div class="admin-section-heading"><div><p class="section-label">COUNTER SALES</p><h2>Point of sale</h2><p class="form-hint">One inventory and one ledger for all sales.</p></div></div>
<div class="pos-grid"><section class="surface-card finance-panel"><h3>Find a product</h3><label class="stack-form">Product name or ID<input data-field="pos-search" type="search" placeholder="Search name or scan numeric product ID" autocomplete="off"></label><p class="form-hint">Scanning is supported when a scanner sends an existing product ID or product name.</p><div data-field="pos-products" class="pos-products" aria-live="polite">Loading inventory…</div></section>
<form class="surface-card finance-panel stack-form" data-form="pos"><h3>Current sale</h3>
<label>Customer name<input name="customer" value="Walk-in customer" minlength="2" maxlength="100" required></label><div data-field="pos-cart" class="pos-cart" aria-live="polite"></div>
<label>Discount (PHP)<input name="discount" type="number" min="0" step="0.01" value="0" required></label><label>Discount reason<input name="discount_reason" maxlength="200" placeholder="Required when applying a discount"></label>
<label>Payment method<select name="payment_method"><option value="cash">Cash</option>{% for code,name in [('gcash','GCash'),('maya','Maya'),('bdo','BDO'),('bpi','BPI'),('metrobank','Metrobank'),('landbank','LandBank')] %}<option value="{{ code }}">{{ name }}</option>{% endfor %}</select></label>
<div class="order-total"><span>Subtotal</span><strong data-field="pos-subtotal">₱0.00</strong></div><div class="order-total"><span>Total</span><strong data-field="pos-total">₱0.00</strong></div><p class="form-hint">No additional tax. Counter pickup has no shipping fee.</p>
<label class="confirmation-option"><input type="checkbox" name="confirmed" required>Confirm this test collection. No real funds transferred.</label><p class="form-error" data-field="form-error" role="alert" hidden></p><button class="primary-btn" type="submit">Complete transaction</button><a class="secondary-btn" data-field="pos-receipt" target="_blank" rel="noopener" hidden>View / print receipt</a><button class="secondary-btn" type="button" data-field="pos-new" hidden>Start next sale</button>
</form></div></section></template>
