<section class="surface-card settings-panel"><p class="section-label">Store preferences</p><h2 class="mt-3 font-display text-3xl font-semibold">Settings</h2><form class="stack-form mt-7" data-form="settings"><label>Store name<input name="store_name" minlength="2" maxlength="100" required></label><label>Support email<input name="support_email" type="email" maxlength="254" required></label><p class="form-error" data-field="form-error" role="alert" hidden></p><button class="primary-btn" type="submit">Save settings</button></form><div class="settings-security"><h3 class="font-semibold">Your administrator account</h3><p class="form-hint mt-2">Update your profile or change your password.</p><button class="secondary-btn mt-4" data-action="admin-account">Manage account</button></div></section>
