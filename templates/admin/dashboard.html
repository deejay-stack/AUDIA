<div class="admin-page min-h-screen bg-stone-50 dark:bg-ink">
  <aside class="fixed inset-y-0 left-0 z-50 flex w-[270px] flex-col border-r border-zinc-200 bg-white p-5 transition-transform dark:border-white/10 dark:bg-[#0d0d10] lg:translate-x-0 -translate-x-full">
    <div class="flex h-12 items-center justify-between px-2">
      <button class="audia-mark flex items-center text-left text-lg" aria-label="Go to AUDIA home" data-action="overview"><span class="mark-a">A</span>UDI<span class="mark-a">A</span></button>
      <button class="icon-btn lg:hidden" data-action="close-sidebar" aria-label="Close admin menu">

          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>
    <div class="mt-7 rounded-2xl bg-zinc-100 p-3 dark:bg-white/[.055]">
      <div class="flex items-center gap-3">
        <div class="grid h-10 w-10 place-items-center rounded-xl bg-zinc-950 text-white dark:bg-acid dark:text-ink">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-store" aria-hidden="true">
            <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"></path>
            <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"></path>
            <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"></path>
          </svg>
        </div>
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold" data-field="store-name">AUDIA Flagship</p>
          <p class="text-[10px] text-zinc-500">Main storefront</p>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down ml-auto text-zinc-500" aria-hidden="true">
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </div>
    </div>
    <nav class="mt-7 space-y-1">
      <p class="mb-3 px-3 text-[9px] font-bold uppercase tracking-[.18em] text-zinc-400">Workspace</p>
      <button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition bg-zinc-950 text-white dark:bg-acid dark:text-ink" data-action="overview"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-dashboard" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg> Overview</button>
      <button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition text-zinc-500 hover:bg-zinc-100 hover:text-zinc-950 dark:hover:bg-white/5 dark:hover:text-white" data-action="sales"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-dollar-sign" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path><path d="M12 18V6"></path></svg> Sales directory<span class="ml-auto rounded-full px-2 py-0.5 text-[9px] bg-zinc-100 dark:bg-white/5" data-field="order-count">0</span></button>
      <button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition text-zinc-500 hover:bg-zinc-100 hover:text-zinc-950 dark:hover:bg-white/5 dark:hover:text-white" data-action="products"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"></path><path d="M12 22V12"></path><polyline points="3.29 7 12 12 20.71 7"></polyline><path d="m7.5 4.27 9 5.15"></path></svg> Products</button>
      <button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium transition text-zinc-500 hover:bg-zinc-100 hover:text-zinc-950 dark:hover:bg-white/5 dark:hover:text-white" data-action="customers"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg> Customers</button>
    </nav>
    <div class="mt-auto space-y-1 border-t border-zinc-200 pt-4 dark:border-white/10">
      <button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm text-zinc-500 hover:bg-zinc-100 dark:hover:bg-white/5" data-action="settings"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg> Settings</button>
      <button class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm text-zinc-500 hover:bg-zinc-100 dark:hover:bg-white/5" data-action="store"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg> View storefront</button>
      <button class="w-full px-3 pt-3 text-left text-[11px] text-zinc-400 hover:text-rose-500" data-action="logout">Sign out of admin</button>
    </div>
  </aside>
  <div class="lg:pl-[270px]">
    <header class="sticky top-0 z-30 flex h-[78px] items-center justify-between border-b border-zinc-200 bg-stone-50/90 px-5 backdrop-blur-xl dark:border-white/10 dark:bg-ink/90 sm:px-8">
      <div class="flex items-center gap-3">
        <button class="icon-btn lg:hidden" data-action="sidebar" aria-label="Open admin menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu" aria-hidden="true">
            <path d="M4 5h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 19h16"></path>
          </svg>
        </button>
        <div>
          <p class="text-[10px] uppercase tracking-[.15em] text-zinc-400">Administration</p>
          <h1 class="font-display text-xl font-semibold" data-field="admin-title">Overview</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="icon-btn relative" aria-label="Notifications" data-action="notifications">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell" aria-hidden="true">
            <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
            <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path>
          </svg>
          <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-rose-500"></span>
        </button>
        <button class="theme-toggle relative flex items-center rounded-full border border-zinc-200 bg-white text-zinc-700 shadow-sm transition hover:border-zinc-300 dark:border-white/10 dark:bg-white/[.05] dark:text-zinc-200 h-10 w-10 justify-center" aria-label="Switch to light mode" title="Switch to light mode" data-action="theme">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </button>
        <div class="ml-1 hidden items-center gap-3 border-l border-zinc-200 pl-4 dark:border-white/10 sm:flex">
          <div class="grid h-9 w-9 place-items-center rounded-full bg-violet-100 text-xs font-bold text-violet-700 dark:bg-violet-400/15 dark:text-violet-300">AJ</div>
          <div>
            <p class="text-xs font-semibold" data-field="admin-name">AUDIA Admin</p>
            <p class="text-[10px] text-zinc-500">Store manager</p>
          </div>
        </div>
      </div>
    </header>
    <main class="p-5 sm:p-8 xl:p-10" data-field="admin-view"></main>
  </div>
</div>
