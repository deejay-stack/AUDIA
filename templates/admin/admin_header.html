<!-- MODULE: ADMIN | COMPONENT: Admin header
     PURPOSE: Admin header structure. CSS: assets/css/admin/admin_header.css
     JS: assets/js/admin/admin.js. Preserve IDs and data-action/data-field hooks. -->
<header
      class="admin-header__administration-overview-aj-audia-admin-header"
    >
      <div class="admin-header__administration-overview-layout">
        <button
          class="icon-btn admin-header__sidebar"
          data-action="sidebar"
          aria-label="Open admin menu"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-menu"
            aria-hidden="true"
          >
            <path d="M4 5h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 19h16"></path>
          </svg>
        </button>
        <div>
          <p class="admin-header__administration">
            Administration
          </p>
          <h1
            class="admin-header__admin-title"
            data-field="admin-title"
          >
            Overview
          </h1>
        </div>
      </div>
      <div class="admin-header__aj-audia-admin-store-manager-layout">
        <button
          class="icon-btn admin-header__notifications"
          aria-label="Notifications"
          data-action="notifications"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-bell"
            aria-hidden="true"
          >
            <path d="M10.268 21a2 2 0 0 0 3.464 0"></path>
            <path
              d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
            ></path>
          </svg>
          <span
            class="admin-header__notifications-span"
          ></span>
        </button>
        <button
          class="theme-toggle admin-header__theme"
          aria-label="Switch to light mode"
          title="Switch to light mode"
          data-action="theme"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-sun"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </button>
        <div
          class="admin-header__aj-audia-admin-store-manager-layout-aj-audia-admin-store-manager"
        >
          <div
            class="admin-header__aj-layout"
          >
            AJ
          </div>
          <div>
            <p class="admin-header__admin-name" data-field="admin-name">
              AUDIA Admin
            </p>
            <p class="admin-header__store-manager">Store manager</p>
          </div>
        </div>
      </div>
    </header>
