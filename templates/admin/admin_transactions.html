<template id="transactions-template"><section class="finance-workspace">
<div class="admin-section-heading"><div><p class="section-label">INTERNAL FINANCIAL LEDGER</p><h2>Payments &amp; transactions</h2></div><a class="secondary-btn" data-field="ledger-export">Export CSV</a></div><p class="form-hint">Test Mode — No real funds transferred. Dates use Asia/Manila.</p>
<form class="ledger-filters stack-form" data-form="ledger"><label>Search<input name="q" type="search" placeholder="Transaction, order, customer"></label><label>From<input name="start" type="date" required></label><label>Through<input name="end" type="date" required></label>
<label>Payment status<select name="status"><option value="">All statuses</option>{% for status in ['Pending','Processing','Pending Verification','Paid','Failed','Cancelled','Partially Refunded','Refunded'] %}<option>{{ status }}</option>{% endfor %}</select></label>
<label>Channel<select name="channel"><option value="">All channels</option><option value="online">Online store</option><option value="pos">Counter POS</option></select></label><label>Method<select name="method"><option value="">All methods</option>{% for method in ['GCash','Maya','BDO','BPI','Metrobank','LandBank','Cash on delivery','Cash'] %}<option>{{ method }}</option>{% endfor %}</select></label>
<label>Sort<select name="sort">{% for key,name in [('date','Date'),('amount','Amount'),('customer','Customer'),('status','Status'),('method','Method'),('channel','Channel')] %}<option value="{{ key }}">{{ name }}</option>{% endfor %}</select></label><label>Direction<select name="direction"><option value="desc">Descending</option><option value="asc">Ascending</option></select></label><label>Records<select name="metric"><option value="">All transactions</option><option value="revenue">Supporting revenue transactions</option>{% for key,label in [('gross_sales','Gross merchandise sales'),('net_sales','Net sales'),('collected_total','Collections'),('refunded_total','Refund events'),('paid_orders','Collected payments'),('products_sold','Products sold'),('pending_collection','Pending collections'),('refunded_transactions','Refunded transactions')] %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><button type="submit" class="primary-btn">Apply filters</button></form>
<p class="form-error" data-field="ledger-error" role="alert" hidden></p><p class="form-hint" data-field="ledger-loading" role="status"></p><div class="surface-card table-wrap"><table class="ledger-table"><thead><tr><th>Transaction / order</th><th>Customer</th><th>Method</th><th>Amount</th><th>Status</th><th>Date (Manila)</th><th>Channel</th><th>Verification</th><th>Actions</th></tr></thead><tbody data-field="ledger-rows"></tbody></table><p class="empty-state" data-field="ledger-empty" hidden>No transactions match these filters.</p></div>
<div class="admin-section-heading"><span data-field="ledger-count"></span><div class="form-actions"><button class="secondary-btn" data-field="ledger-prev">Previous</button><button class="secondary-btn" data-field="ledger-next">Next</button></div></div></section></template>
<template id="transaction-detail-template"><section class="stack-form"><p class="form-hint">Internal record · Test Mode — No real funds transferred.</p><dl class="detail-list" data-field="transaction-info"></dl><h3>Payment audit trail</h3><ul class="order-history" data-field="transaction-events"></ul><h3>Refunds</h3><ul class="order-history" data-field="transaction-refunds"></ul><button class="secondary-btn" data-field="transaction-order">View order and receipt</button><form class="stack-form" data-field="refund-form"><h3>Record refund</h3><p class="form-hint">Refunds reduce collections. Inspect returned goods before adjusting inventory.</p><label>Amount (PHP)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Reason<input name="reason" minlength="3" maxlength="300" required></label><label class="confirmation-option"><input type="checkbox" required>I confirm this internal test refund. No real funds transferred.</label><p class="form-error" data-field="form-error" role="alert" hidden></p><button class="primary-btn" type="submit">Record refund</button></form></section></template>
